[package]
name = "hdc-direct"
version = "0.1.0"
edition = "2021"
description = "HDC client that talks directly to on-device hdcd over TCP (no hdc server / UDS required)"
license = "Apache-2.0"

[[bin]]
name = "hdc-direct"
path = "src/main.rs"

[dependencies]
rsa = { version = "0.9", features = ["sha2", "pem", "getrandom"] }

base64 = "0.22"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
