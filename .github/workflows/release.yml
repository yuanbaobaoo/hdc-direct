name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Package
        run: npm run pack:release

      - name: Verify assets
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TARBALL="hdc-direct-${VERSION}.tar.gz"
          TGZ="hdc-direct-${VERSION}.tgz"
          test -f "dist-release/$TARBALL"
          test -f "dist-release/$TARBALL.sha256"
          test -f "dist-release/$TGZ"
          test -f "dist-release/$TGZ.sha256"
          test -f "dist-release/hdc-direct-${VERSION}.json"
          (cd dist-release && sha256sum -c "$TARBALL.sha256" && sha256sum -c "$TGZ.sha256")
          LIST_DIR="$(mktemp -d)"
          tar -tzf "dist-release/$TARBALL" > "$LIST_DIR/tar.txt"
          tar -tzf "dist-release/$TGZ" > "$LIST_DIR/tgz.txt"
          grep -q "dist/src/cli.js" "$LIST_DIR/tar.txt"
          grep -qx "package/dist/src/cli.js" "$LIST_DIR/tgz.txt"
          grep -qx "package/package.json" "$LIST_DIR/tgz.txt"

      - name: Package smoke test
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TGZ="$PWD/dist-release/hdc-direct-${VERSION}.tgz"

          # npm 安装：验证 .bin 软链入口能正常执行
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install "$TGZ" >/dev/null
          NPM_OUT="$(./node_modules/.bin/hdc-direct -v)"
          echo "$NPM_OUT"
          case "$NPM_OUT" in
            Ver:*) ;;
            *) exit 1 ;;
          esac
          node --input-type=module -e "import { HdcSession } from 'hdc-direct'; if (typeof HdcSession !== 'function') process.exit(1)"

          # pnpm 安装：验证 lockfile 记录 integrity，且 .bin 可用
          npm install -g pnpm@11 >/dev/null
          mkdir pnpm-case
          cd pnpm-case
          pnpm init >/dev/null
          pnpm add "$TGZ" >/dev/null
          PNPM_OUT="$(./node_modules/.bin/hdc-direct -v)"
          echo "$PNPM_OUT"
          case "$PNPM_OUT" in
            Ver:*) ;;
            *) exit 1 ;;
          esac
          grep -q 'integrity:' pnpm-lock.yaml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hdc-direct-assets
          path: dist-release/*
          if-no-files-found: error

      - name: Compose release body
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          PREV="$(git tag --list 'v*' --sort=-v:refname | grep -v "^v${VERSION}$" | head -n1 || true)"
          {
            echo "## hdc-direct v${VERSION}"
            echo
            echo "直连 hdcd 的 HDC 客户端（TypeScript，零运行时依赖，Node ≥ 18）。"
            echo
            echo "### 变更"
            echo
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s (%h)' "${PREV}..HEAD"
            else
              git log --no-merges --pretty='- %s (%h)'
            fi
            echo
            echo "### 资产"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`hdc-direct-${VERSION}.tgz\` | npm 包布局（顶层 \`package/\`），可写进 \`package.json\` 作为 URL 依赖 |"
            echo "| \`hdc-direct-${VERSION}.tgz.sha256\` | 校验和 |"
            echo "| \`hdc-direct-${VERSION}.tar.gz\` | 解包即用，入口 \`dist/src/cli.js\` |"
            echo "| \`hdc-direct-${VERSION}.tar.gz.sha256\` | 校验和 |"
            echo "| \`hdc-direct-${VERSION}.json\` | 版本元信息（协议验证版本、入口、运行时） |"
            echo
            echo "### 使用"
            echo
            echo '```sh'
            echo "tar -xzf hdc-direct-${VERSION}.tar.gz"
            echo "node hdc-direct-${VERSION}/dist/src/cli.js -v"
            echo '```'
            echo
            echo "### 作为 node_modules 依赖"
            echo
            echo '```json'
            echo '{'
            echo '  "dependencies": {'
            echo "    \"hdc-direct\": \"https://github.com/yuanbaobaoo/hdc-direct/releases/download/v${VERSION}/hdc-direct-${VERSION}.tgz\""
            echo '  }'
            echo '}'
            echo '```'
            echo
            echo '```sh'
            echo "pnpm install"
            echo '```'
            echo
            echo "\`pnpm-lock.yaml\` 会记录 tarball 的 integrity；升级时把 URL 里的版本号改掉再 \`pnpm install\`。"
            echo
            echo "首次连接会在设备上弹一次「允许调试」授权；私钥需为无口令 PKCS8 PEM。"
          } > dist-release/release-body.md
          cat dist-release/release-body.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist-release/release-body.md
          files: |
            dist-release/hdc-direct-*.tgz
            dist-release/hdc-direct-*.tgz.sha256
            dist-release/hdc-direct-*.tar.gz
            dist-release/hdc-direct-*.tar.gz.sha256
            dist-release/hdc-direct-*.json
          fail_on_unmatched_files: true
